# Supabase's free plan pauses a project after about a week of low activity (accounts and backup then stop working).
# This asks the database for one row every day so that does not happen. If it ever fails, GitHub emails the repo owner:
# that is the signal to open the Supabase dashboard. The URL and anon key are public by design (they ship inside the
# app); row-level security is what keeps the data private, and the request below can only ever read what it is allowed to.
name: keep Supabase awake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ask the database for one row
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://gqixvanhkytgoscohhbj.supabase.co/rest/v1/records?select=id&limit=1" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxaXh2YW5oa3l0Z29zY29oaGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzY3NjAsImV4cCI6MjEwNTU1Mjc2MH0.OsNgzugwOXldaBfveubS7NcaT7_rpOfORx3dmYe_ncA" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxaXh2YW5oa3l0Z29zY29oaGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzY3NjAsImV4cCI6MjEwNTU1Mjc2MH0.OsNgzugwOXldaBfveubS7NcaT7_rpOfORx3dmYe_ncA")
          echo "supabase answered HTTP $code"
          test "$code" = "200"
